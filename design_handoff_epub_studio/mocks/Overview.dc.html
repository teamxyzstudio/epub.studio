<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Archivo:wght@400;500;600&amp;family=IBM+Plex+Mono&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#EDE8E0;color:#17130E}
body{font-family:'Archivo',system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#17130E}a:hover{color:#FF2E63}
</style>
</helmet>
<div style="padding:44px 48px 80px;min-width:fit-content">
  <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:8px">
    <svg width="26" height="26" viewBox="0 0 24 24" style="align-self:center"><rect x="1.5" y="1.5" width="21" height="21" rx="5.5" fill="#17130E"></rect><rect x="6" y="7" width="12" height="2.2" rx="1.1" fill="#FAF7F2"></rect><rect x="6" y="11" width="9" height="2.2" rx="1.1" fill="#FF2E63"></rect><rect x="6" y="15" width="11" height="2.2" rx="1.1" fill="#FAF7F2"></rect></svg>
    <span style="font-family:'Instrument Serif',serif;font-size:30px">Epub Studio<span style="color:#FF2E63">.</span> — all screens</span>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6E675D">desktop + mobile · fully interactive (click into any frame)</span>
  </div>
  <div style="font-size:13px;color:#6E675D;margin-bottom:36px">Open full size: <a href="Home.dc.html">Homepage</a> · <a href="EPUB%20to%20PDF.dc.html">EPUB to PDF</a> · <a href="Style%20Studio.dc.html">Style Studio</a> · <a href="Blog.dc.html">Blog</a> · <a href="Blog%20Post.dc.html">Blog post</a> · <a href="Identity.dc.html">Identity</a></div>

  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
    <div style="margin-bottom:52px">
      <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;background:#17130E;color:#FAF7F2;padding:3px 8px;border-radius:4px">{{ r.num }}</span>
        <a href="{{ r.href }}" style="font-family:'Instrument Serif',serif;font-size:24px;text-decoration:none">{{ r.name }}</a>
        <span style="font-size:12.5px;color:#6E675D">{{ r.note }}</span>
      </div>
      <div style="display:flex;gap:36px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="width:936px;height:585px;overflow:hidden;border-radius:10px;border:1px solid rgba(23,19,14,.2);box-shadow:0 14px 40px rgba(23,19,14,.12);background:#FAF7F2">
            <iframe src="{{ r.href }}" title="{{ r.name }} — desktop" style="width:1440px;height:900px;border:none;transform:scale(0.65);transform-origin:top left"></iframe>
          </div>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6E675D">desktop · 1440</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="padding:10px;border-radius:34px;background:#17130E;box-shadow:0 14px 40px rgba(23,19,14,.18)">
            <div style="width:273px;height:591px;overflow:hidden;border-radius:26px;background:#FAF7F2">
              <iframe src="{{ r.href }}" title="{{ r.name }} — mobile" style="width:390px;height:844px;border:none;transform:scale(0.7);transform-origin:top left"></iframe>
            </div>
          </div>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6E675D">mobile · 390</span>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { num: '01', name: 'Homepage', note: 'living-book hero, drag-anywhere upload, grouped tool grid, bottom tabs on mobile', href: 'Home.dc.html' },
        { num: '02', name: 'Tool page — EPUB to PDF', note: 'template for all 21 tools · upload → options → convert → download, sticky CTA on mobile', href: 'EPUB%20to%20PDF.dc.html' },
        { num: '03', name: 'Style Studio', note: 'after PDF → EPUB · presets, saved vs preview-only layers, live book preview, bottom sheet on mobile', href: 'Style%20Studio.dc.html' },
        { num: '04', name: 'Blog — listing', note: 'SEO hub · category filters, featured guide, post grid, newsletter', href: 'Blog.dc.html' },
        { num: '05', name: 'Blog — article', note: 'detail template · reading progress, sticky TOC, comparison table, tool CTAs', href: 'Blog%20Post.dc.html' },
        { num: '06', name: 'Identity', note: 'the re-typeset line mark, wordmark, icon, color, type, voice', href: 'Identity.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
